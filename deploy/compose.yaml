services:
  homecal-db-prod:
    image: postgres:17-alpine
    container_name: homecal-db-prod
    restart: unless-stopped
    ports:
      - "51432:5432"
    environment:
      - POSTGRES_DB=homecal_prod
      - POSTGRES_USER=homecal
      - POSTGRES_PASSWORD=homecal_prod
    volumes:
      - homecal-db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecal -d homecal_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  homecal-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: homecal-api
    restart: unless-stopped
    network_mode: host
    depends_on:
      homecal-db-prod:
        condition: service_healthy
    env_file: .env.production
    environment:
      - API_PORT=51001
      - DATABASE_URL=postgresql://homecal:homecal_prod@localhost:51432/homecal_prod
    volumes:
      - /etc/resolv.conf:/etc/resolv.conf:ro

  homecal-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:51001
        - NEXT_PUBLIC_AUTH_URL=http://192.168.1.163:51000
    container_name: homecal-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      - homecal-api
    environment:
      - PORT=51000
      - HOSTNAME=0.0.0.0
    volumes:
      - /etc/resolv.conf:/etc/resolv.conf:ro

volumes:
  homecal-db-prod-data:
