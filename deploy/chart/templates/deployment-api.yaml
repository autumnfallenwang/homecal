apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homecal.fullname" (dict "context" . "component" "api") }}
  labels:
    {{- include "homecal.labels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  # Recreate, not RollingUpdate. The reminder scheduler is a setInterval
  # singleton inside the API process; running two pods in parallel during a
  # rolling cutover would double-fire email + APNs reminders.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "homecal.selectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homecal.selectorLabels" (dict "context" . "component" "api") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          env:
            # Plaintext config (URLs, model names, ports) from values.yaml
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # Secrets — wired via secretKeyRef to homecal-secrets, created out-of-band.
            # See F1 task in docs/phase19-k3s-migration-memo.md for the kubectl create command.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BETTER_AUTH_SECRET
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: EMAIL_FROM
                  optional: true
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: EMAIL_PASSWORD
                  optional: true
            - name: APNS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: APNS_PRIVATE_KEY
                  optional: true
          livenessProbe:
            {{- toYaml .Values.api.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
