name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize back-to-back main pushes so an in-flight arch-infra bump
# isn't cancelled mid-clone-push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Unit tests don't actually connect to a DB, but `apps/api/src/db/index.ts`
    # throws at module load if DATABASE_URL is unset. Locally vitest.config.ts
    # loads apps/api/.env via dotenv; on CI there's no .env. Supply a dummy
    # so the import chain resolves — the actual integration tests (which DO
    # connect) are only invoked via `pnpm test`, not `test:fast`.
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint is intentionally NOT a CI gate here — keep lint as a local
      # pre-merge gate. CI runs the fast test suite only; integration tests
      # need a live Postgres which the CI runner doesn't ship.
      - run: pnpm test:fast

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/autumnfallenwang/homecal-${{ matrix.component }}:latest
            ghcr.io/autumnfallenwang/homecal-${{ matrix.component }}:${{ github.sha }}
          # Only the web image bakes browser-side URLs into the client bundle
          # (Next.js inlines NEXT_PUBLIC_* at build time). The web build needs
          # both URLs:
          #   - NEXT_PUBLIC_API_URL: fallback for Next.js's rewrite proxy
          #     (the chart overrides this at runtime with API_URL=http://homecal-api,
          #     internal Service DNS — see next.config.ts).
          #   - NEXT_PUBLIC_AUTH_URL: Better Auth client baseURL, browser-side
          #     direct calls to /api/auth/* (bypasses the rewrite).
          # API image needs no build args.
          build-args: |
            ${{ matrix.component == 'web' && 'NEXT_PUBLIC_API_URL=http://homecal-api.arch.local' || '' }}
            ${{ matrix.component == 'web' && 'NEXT_PUBLIC_AUTH_URL=http://homecal-api.arch.local' || '' }}
          # Separate cache scopes — api and web have unrelated dep trees,
          # sharing one cache would thrash constantly.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  bump-arch-infra:
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Bump api+web image tags in arch-infra
        env:
          GH_TOKEN: ${{ secrets.ARCH_INFRA_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ARCH_INFRA_TOKEN not set — see docs/phase19-k3s-migration-memo.md task D2. Skipping arch-infra bump."
            exit 0
          fi

          # Use x-access-token URL so `git push` carries the PAT — `gh repo clone`
          # would not bake the token into the push URL (homenews gotcha #2).
          git clone "https://x-access-token:${GH_TOKEN}@github.com/autumnfallenwang/arch-infra.git" /tmp/arch-infra
          cd /tmp/arch-infra

          if [ ! -f apps/homecal.yaml ]; then
            echo "::warning::apps/homecal.yaml not present in arch-infra (task E1 pending). Skipping bump."
            exit 0
          fi

          # Single yq write rewrites both api.image.tag and web.image.tag —
          # ArgoCD rolls api + web together (they're built from the same SHA;
          # the web bundle bakes NEXT_PUBLIC_AUTH_URL at build time, contract
          # evolves in lockstep). Per homenews gotcha #3: yq, not sed.
          # yq (mike farah v4) is preinstalled on ubuntu-latest.
          yq -i '
            (.spec.source.helm.parameters[] | select(.name == "api.image.tag") | .value) = strenv(SHA) |
            (.spec.source.helm.parameters[] | select(.name == "web.image.tag") | .value) = strenv(SHA)
          ' apps/homecal.yaml

          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"

          if git diff --quiet apps/homecal.yaml; then
            echo "No change — arch-infra apps/homecal.yaml already at $SHA."
            exit 0
          fi

          git add apps/homecal.yaml
          git commit -m "homecal: bump api+web images to $SHA"
          git push
