# Dependabot is currently DISABLED (matches homenews's posture — not on an
# eager-update cadence; manual review preferred).
#
# How disable works: `open-pull-requests-limit: 0` is GitHub's official signal
# to stop opening PRs for an ecosystem. The file stays in the repo so the
# config + group patterns are documented and ready to re-enable.
#
# To RE-ENABLE: change every `open-pull-requests-limit: 0` below back to a
# positive integer (5 is a reasonable default for npm; omit the line entirely
# for docker + github-actions to use the GitHub default of 5). Commit, push,
# dependabot resumes scanning weekly.

version: 2
updates:
  # npm — keep API + web dependency trees current. Grouped where bumps cluster.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      hono:
        patterns:
          - "hono"
          - "@hono/*"
          - "hono-rate-limiter"
      better-auth:
        patterns:
          - "better-auth"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      pino:
        patterns:
          - "pino"
          - "pino-pretty"

  # Docker base images (node:22-alpine + postgres:17-alpine — security backports,
  # eventually node:24).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  # GHA actions (checkout / setup-node / docker-* / pnpm/action-setup —
  # drift starts forcing Node 24 on 2026-06-02; bumps will surface before then).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
