# SwiftLint configuration for HomeCal iOS

excluded:
  - .build
  - .swiftpm

# Relax rules that conflict with SwiftUI patterns
disabled_rules:
  - trailing_comma
  - opening_brace        # conflicts with SwiftUI modifier chains

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_imports

# Allow short names common in Swift (e.g. `id`, `to`, `on`)
identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - to
    - on
    - i
    - x
    - y

line_length:
  warning: 150
  error: 200

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100
